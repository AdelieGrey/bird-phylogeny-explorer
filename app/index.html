<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bird Phylogeny Explorer</title>
    <link rel="icon" type="image/png" href="./assets/wagtail-icon.png?v=2" />
    <link rel="stylesheet" href="./styles.css?v=120" />
  </head>
  <body>
    <main class="app-shell tree-feather-assets-demo">
      <aside class="search-panel" aria-label="Search panel">
        <div class="brand">
          <img class="brand-logo" src="./assets/wagtail-logo.png?v=2" alt="白鹡鸰图标" />
          <div>
            <p class="kicker">Bird Phylogeny Explorer</p>
            <h1>鸟类谱系速查器</h1>
            <p class="byline">by BlueJay</p>
          </div>
        </div>

        <label class="search-box">
          <span>搜索中文名 / English / Latin / 拼音</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="试试：红喉北蜂鸟、Falco、Strisores" />
        </label>

        <div class="quick-list" id="quickList" aria-label="Quick searches"></div>

        <div class="results-header">
          <span id="resultCount">0 results</span>
          <button id="clearSearch" class="ghost-button" type="button">清除</button>
        </div>
        <div class="results" id="results"></div>
      </aside>

      <section class="tree-panel" aria-label="Phylogeny tree">
        <div class="toolbar">
          <div>
            <p class="kicker">Lineage</p>
            <h2 id="treeTitle">Aves 鸟纲</h2>
          </div>
          <div class="tool-buttons">
            <button id="collapseAll" type="button" title="Collapse all">折叠</button>
            <button id="expandPath" type="button" title="Expand selected lineage">展开路径</button>
            <button id="pathOnly" type="button" title="只显示当前谱系路径" aria-pressed="false">仅路径</button>
          </div>
        </div>
        <div class="tree" id="tree"></div>
      </section>

      <aside class="detail-panel" aria-label="Taxon details">
        <section class="detail-block primary-detail" id="detail"></section>
        <section class="detail-block" id="relatedBlock">
          <div class="section-head">
            <p class="kicker">Related</p>
            <h2>相关内容</h2>
          </div>
          <div class="comparison-list" id="relatedContent"></div>
        </section>
        <section class="detail-block" id="comparisonBlock">
          <div class="section-head">
            <p class="kicker">Lookalikes</p>
            <h2>你也许会联想到……</h2>
          </div>
          <div class="comparison-list" id="comparisons"></div>
        </section>
        <section class="detail-block">
          <div class="section-head">
            <p class="kicker">Lineage Path</p>
            <h2>系统发育节点</h2>
          </div>
          <ol class="lineage-list" id="lineage"></ol>
        </section>
        <section class="detail-block source-block">
          <div class="section-head">
            <p class="kicker">Data Source</p>
            <h2>数据来源</h2>
          </div>
          <p id="sourceNote"></p>
        </section>
      </aside>
    </main>

    <script src="./bird-data.js?v=27"></script>
    <script src="./app.js?v=31"></script>
  </body>
</html>
